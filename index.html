<!DOCTYPE html>
<html lang="en">
<head>
  <!-- AdSense + Google Analytics are deferred until first interaction (or
       shortly after load) to keep them off the critical path. See the
       loader script before </body>. -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary SEO -->
  <title>LinkedIn Opener Pro - Bulk LinkedIn Profile Opener & CEO Finder</title>
  <meta name="apple-mobile-web-app-title" content="LinkedIn Opener Pro">
  <meta name="description" content="LinkedIn Opener Pro helps you open multiple LinkedIn profiles instantly, find CEOs, research companies, and save hours on networking. Boost your LinkedIn productivity today!" />
  <meta name="keywords" content="LinkedIn automation, LinkedIn bulk profile opener, CEO finder, company research, networking tool, LinkedIn productivity" />
  <meta name="author" content="LinkedIn Opener Pro" />
  <link rel="canonical" href="https://profileopener.netlify.app/" />
  
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="Uk3At5gc6OYWMn1zmULpfwsM7qycNYAYt_HFoC2_tFw" />
  
  <!-- Favicon & Theme -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <meta name="theme-color" content="#0A66C2" />

  <!-- Open Graph / Facebook -->
   <meta property="og:site_name" content="LinkedIn Opener Pro" />
  <meta property="og:title" content="LinkedIn Opener Pro - Bulk LinkedIn Profile Opener & CEO Finder" />
  <meta property="og:description" content="Open multiple LinkedIn profiles instantly. Find CEOs, research companies, and boost your networking productivity with LinkedIn Opener Pro." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://profileopener.netlify.app/" />
  <meta property="og:image" content="https://profileopener.netlify.app/images/default-preview.png" />
  <meta property="og:image:alt" content="LinkedIn Opener Pro Preview" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LinkedIn Opener Pro - Bulk LinkedIn Profile Opener & CEO Finder" />
  <meta name="twitter:description" content="Open multiple LinkedIn profiles instantly. Find CEOs, research companies, and boost networking productivity." />
  <meta name="twitter:image" content="https://profileopener.netlify.app/images/default-preview.png" />
  <meta name="twitter:site" content="@linkedin_opener_pro" />

  <!-- Preload important assets -->
  <link rel="preload" href="/src/main.tsx" as="script">

  <!-- Structured Data: Website + Organization + Breadcrumb -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "LinkedIn Opener Pro",
        "url": "https://profileopener.netlify.app/",
        "description": "Open multiple LinkedIn profiles instantly. Find CEOs, research companies, and boost networking productivity.",
        "publisher": {
          "@type": "Organization",
          "name": "LinkedIn Opener Pro",
          "logo": {
            "@type": "ImageObject",
            "url": "https://profileopener.netlify.app/images/default-preview.png"
          }
        }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://profileopener.netlify.app/"
          }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Deferred third-party loader: AdSense + Google Analytics.
       Loads on the first user interaction, or 3.5s after window load —
       whichever comes first. Keeps ~2s of third-party JS off the
       critical path so it no longer blocks FCP/LCP/TBT. -->
  <script>
    (function () {
      var ADSENSE = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8597674308771036";
      var GA_ID = "G-N2D12MLMG3";
      var loaded = false;

      function loadThirdParty() {
        if (loaded) return;
        loaded = true;

        // Google Analytics
        var ga = document.createElement("script");
        ga.async = true;
        ga.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(ga);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag("js", new Date());
        window.gtag("config", GA_ID);

        // Google AdSense
        var ad = document.createElement("script");
        ad.async = true;
        ad.crossOrigin = "anonymous";
        ad.src = ADSENSE;
        document.head.appendChild(ad);
      }

      var events = ["scroll", "mousemove", "touchstart", "keydown", "pointerdown"];
      function onInteract() {
        events.forEach(function (e) { window.removeEventListener(e, onInteract); });
        loadThirdParty();
      }
      events.forEach(function (e) {
        window.addEventListener(e, onInteract, { passive: true });
      });

      // Fallback so scripts still load on a no-interaction visit.
      if (document.readyState === "complete") {
        setTimeout(loadThirdParty, 3500);
      } else {
        window.addEventListener("load", function () {
          setTimeout(loadThirdParty, 3500);
        });
      }
    })();
  </script>
</body>
</html>
